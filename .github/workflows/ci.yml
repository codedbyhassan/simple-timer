name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run check:contrast
      - run: npm run build
      - run: npm run build:dev
      - run: python -m pip install --upgrade pip playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run local-first browser smoke tests
        run: |
          npm run dev -- --host 127.0.0.1 --port 5199 > /tmp/ascend-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5199 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5199 >/dev/null || { cat /tmp/ascend-vite.log; exit 1; }
          python tests/e2e/shell_flows.py
